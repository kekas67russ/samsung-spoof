plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gorba.wcsspoof'
    compileSdk 34

    defaultConfig {
        applicationId "com.gorba.wcsspoof"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    compileOnly 'com.ghgande:j2mod:3.1.1'
    compileOnly 'ch.acra:acra-core:5.11.3'
    compileOnly 'com.bugsnag:bugsnag-android:6.1.0'
}

