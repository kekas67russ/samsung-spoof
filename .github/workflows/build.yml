name: Android CI

on:
  push:
    branches: [ "main", "master", "основной" ]
  pull_request:
    branches: [ "main", "master", "основной" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.2.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2.1'

    - name: Compile Local Xposed API
      run: |
        mkdir -p app/libs/de/robv/android/xposed/callbacks
        
        # 1. Сначала создаем и компилируем базовый пакет callbacks
        echo "package de.robv.android.xposed.callbacks; public class XC_LoadPackage { public static class LoadPackageParam { public String packageName; public ClassLoader classLoader; } }" > app/libs/de/robv/android/xposed/callbacks/XC_LoadPackage.java
        javac app/libs/de/robv/android/xposed/callbacks/XC_LoadPackage.java
        
        # 2. Теперь создаем интерфейсы главного пакета, использующие callbacks
        echo "package de.robv.android.xposed; public interface IXposedHookLoadPackage { void handleLoadPackage(de.robv.android.xposed.callbacks.XC_LoadPackage.LoadPackageParam lpparam) throws Throwable; }" > app/libs/de/robv/android/xposed/IXposedHookLoadPackage.java
        echo "package de.robv.android.xposed; import java.lang.reflect.Method; public class XposedHelpers { public static abstract class MethodHook { protected void beforeHookedMethod(MethodHookParam param) throws Throwable {} protected void afterHookedMethod(MethodHookParam param) throws Throwable {} } public static class MethodHookParam { public Object[] args; public Object getResult() { return null; } public void setResult(Object result) {} } public static Object findAndHookMethod(Class<?> clazz, String methodName, Object... parameterTypesAndCallback) { return null; } }" > app/libs/de/robv/android/xposed/XposedHelpers.java
        
        # 3. Докомпилируем оставшиеся файлы и пакуем всё в один архив api.jar
        javac -cp app/libs app/libs/de/robv/android/xposed/*.java
        jar cf app/libs/api.jar -C app/libs de
        rm -rf app/libs/de

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: wcsspoof-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        
